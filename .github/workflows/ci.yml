name: Swift tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Test
        run: swift test --disable-sandbox
      - name: Compile release executable
        run: swift build --disable-sandbox -c release
